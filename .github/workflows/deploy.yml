name: Deploy

# Publica dist/aldoria.html no S3 + CloudFront a cada push na main (ou manualmente).
# Variáveis em Settings > Secrets and variables > Actions > Variables: AWS_ROLE_ARN, AWS_REGION, S3_BUCKET, CF_DISTRIBUTION_ID
# (valores em `terraform output`, ver infra/README.md)

on:
  push:
    branches: [main]
    paths: ['src/**', 'build.py']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: python build.py

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Enviar para o S3
        run: |
          aws s3 cp dist/aldoria.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --content-type "text/html; charset=utf-8" --cache-control "no-cache"

      - name: Invalidar o CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --paths "/index.html" "/"
